<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테마나비 - 주식 테마 분석 뷰어</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous" />
    <link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <!-- 모바일 전용 상단바 (PC에서는 CSS로 숨김) -->
    <div class="mobile-topbar">
        <button id="menu-toggle-btn" class="menu-toggle-btn" aria-label="메뉴 열기">
            <i class="ph ph-list"></i>
        </button>
        <div class="mobile-logo">
            <i class="ph-fill ph-trend-up"></i>
            <span>DAJAVATA</span>
        </div>
    </div>

    <!-- 사이드바 열렸을 때 뒤 배경 어둡게 처리 (탭하면 닫힘) -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="/" style="text-decoration: none; color: inherit;">
                    <div class="logo">
                        <i class="ph-fill ph-trend-up"></i>
                        <span style="font-weight: 900; letter-spacing: 1px;">DAJAVATA</span>
                    </div>
                </a>
            </div>
            
            <div class="search-box">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" placeholder="검색어를 입력하세요">
            </div>

            <nav class="menu-group">
                <div class="menu-section">
                    <h3>테마 보기</h3>
                    <ul id="theme-menu-list">
                        <li class="active" data-action="all"><a href="#"><i class="ph ph-squares-four"></i> 전체 테마</a></li>
                        <li data-action="rising"><a href="#"><i class="ph ph-trend-up"></i> 상승중인 테마</a></li>
                        <li data-action="falling"><a href="#"><i class="ph ph-trend-down"></i> 하락중인 테마</a></li>
                        <li data-action="high-return"><a href="#"><i class="ph ph-rocket"></i> 기대수익률 높은 테마</a></li>
                        <li data-action="neglected"><a href="#"><i class="ph ph-ghost"></i> 많이 소외된 테마</a></li>
                    </ul>
                </div>
                
                <div class="menu-section">
                    <h3>조건별 종목</h3>
                    <ul id="stock-menu-list">
                        <li data-action="stock-rising"><a href="#"><i class="ph ph-arrow-up-right"></i> 상승중인 종목</a></li>
                        <li data-action="stock-falling"><a href="#"><i class="ph ph-arrow-down-right"></i> 하락중인 종목</a></li>
                        <li data-action="stock-low-pbr"><a href="#"><i class="ph ph-tag"></i> PBR 낮은 종목</a></li>
                        <li data-action="stock-low-per"><a href="#"><i class="ph ph-calculator"></i> PER 낮은 종목</a></li>
                        <li data-action="stock-high-marcap"><a href="#"><i class="ph ph-money"></i> 시가총액 높은 종목</a></li>
                        <li data-action="stock-high52"><a href="#"><i class="ph ph-crown"></i> 신고점 돌파 종목 (52주)</a></li>
                    </ul>
                </div>
            </nav>
            
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <div class="header-title">
                    <span class="theme-badge">전체</span>
                    <h1>테마 리스트</h1>
                </div>
            </header>

            <section class="table-container">
                <table id="theme-table">
                    <thead>
                        <tr>
                            <th>테마명</th>
                            <th class="right">전일비</th>
                            <th class="right">3일합산</th>
                            <th class="right">52주 상승률</th>
                            <th class="right">52주 하락률</th>
                            <th class="center">52주 소외지수</th>
                            <th class="right">3년 상승률</th>
                            <th class="right">3년 하락률</th>
                            <th class="center">3년 소외지수</th>
                            <th class="center">업데이트</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Data rows will be injected by app.js -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    
    <script src="app.js?v=5"></script>
</body>
</html>
