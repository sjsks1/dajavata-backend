<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #16181a;
    color: #ffffff;
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    margin: 0;
    padding: 30px;
    width: 600px;
  }
  .card-container {
    background-color: #1e2124;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    border: 1px solid #2f3336;
  }
  .header-title {
    font-size: 18px;
    font-weight: bold;
    color: #4da6ff;
    margin-bottom: 20px;
    border-left: 4px solid #4da6ff;
    padding-left: 10px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .box {
    background-color: #272a2e;
    border-radius: 8px;
    padding: 15px 10px;
    width: calc(33.333% - 7px);
    box-sizing: border-box;
    text-align: center;
    border: 1px solid #3a3f45;
  }
  .box-title { font-size: 13px; color: #e1e8ed; margin-bottom: 8px; font-weight: bold; }
  .box-change { font-size: 16px; font-weight: bold; }
  .up { color: #ff4d4d; }
  .down { color: #4d94ff; }
  .flat { color: #a0aab2; }
</style>
</head>
<body>
  <div class="card-container">
    <div class="header-title">주요 테마 ETF 수익률</div>
    <div class="grid">
      {THEME_ETF_BOXES}
    </div>
  </div>
</body>
</html>
