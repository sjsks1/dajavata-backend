<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #16181a;
    color: #ffffff;
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    margin: 0;
    padding: 30px;
    width: 600px;
  }
  .card-container {
    background-color: #1e2124;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    border: 1px solid #2f3336;
  }
  .header-title {
    font-size: 18px;
    font-weight: bold;
    color: #4da6ff;
    margin-bottom: 20px;
    border-left: 4px solid #4da6ff;
    padding-left: 10px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
  }
  .box {
    background-color: #272a2e;
    border-radius: 12px;
    padding: 20px;
    width: calc(50% - 7.5px);
    box-sizing: border-box;
    border: 1px solid #3a3f45;
  }
  .box-title { font-size: 16px; color: #ffb366; margin-bottom: 10px; font-weight: bold; }
  .box-change { font-size: 14px; font-weight: bold; color: #ff4d4d; margin-bottom: 10px; }
  .box-stocks { font-size: 13px; color: #cccccc; line-height: 1.4; }
</style>
</head>
<body>
  <div class="card-container">
    <div class="header-title">오늘의 강세 섹터</div>
    <div class="grid">
      {SECTOR_BOXES}
    </div>
  </div>
</body>
</html>
