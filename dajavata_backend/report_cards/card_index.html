<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #16181a;
    color: #ffffff;
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    margin: 0;
    padding: 30px;
    width: 600px;
  }
  .card-container {
    background-color: #1e2124;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    border: 1px solid #2f3336;
  }
  .header-title {
    font-size: 18px;
    font-weight: bold;
    color: #4da6ff;
    margin-bottom: 20px;
    border-left: 4px solid #4da6ff;
    padding-left: 10px;
  }
  .grid {
    display: flex;
    justify-content: space-between;
    gap: 15px;
  }
  .box {
    background-color: #272a2e;
    border-radius: 12px;
    padding: 15px;
    flex: 1;
  }
  .box-title { font-size: 14px; color: #a0aab2; margin-bottom: 10px; }
  .box-value { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
  .box-change { font-size: 14px; font-weight: bold; }
  .up { color: #ff4d4d; }
  .down { color: #4d94ff; }
  .flat { color: #a0aab2; }
</style>
</head>
<body>
  <div class="card-container">
    <div class="header-title">주요 지수 마감</div>
    <div class="grid">
      <div class="box">
        <div class="box-title">KOSPI</div>
        <div class="box-value">{KOSPI_CLOSE}</div>
        <div class="box-change {KOSPI_COLOR}">{KOSPI_CHANGE} ({KOSPI_RATE}%)</div>
      </div>
      <div class="box">
        <div class="box-title">KOSDAQ</div>
        <div class="box-value">{KOSDAQ_CLOSE}</div>
        <div class="box-change {KOSDAQ_COLOR}">{KOSDAQ_CHANGE} ({KOSDAQ_RATE}%)</div>
      </div>
      <div class="box">
        <div class="box-title">원/달러 환율</div>
        <div class="box-value">{USD_CLOSE}</div>
        <div class="box-change {USD_COLOR}">{USD_CHANGE}원 ({USD_RATE}%)</div>
      </div>
    </div>
  </div>
</body>
</html>
