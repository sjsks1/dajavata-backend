<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #16181a;
    color: #ffffff;
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    margin: 0;
    padding: 30px;
    width: 600px;
  }
  .card-container {
    background-color: #1e2124;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    border: 1px solid #2f3336;
  }
  .header-title {
    font-size: 18px;
    font-weight: bold;
    color: #4da6ff;
    margin-bottom: 20px;
    border-left: 4px solid #4da6ff;
    padding-left: 10px;
  }
  .grid {
    display: flex;
    justify-content: space-between;
    gap: 15px;
  }
  .box {
    background-color: #272a2e;
    border-radius: 12px;
    padding: 20px;
    flex: 1;
  }
  .box-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; text-align: center; color: #ffffff; }
  .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
  .label { color: #a0aab2; }
  .up { color: #ff4d4d; font-weight: bold; }
  .down { color: #4d94ff; font-weight: bold; }
  .flat { color: #ffffff; font-weight: bold; }
</style>
</head>
<body>
  <div class="card-container">
    <div class="header-title">수급 동향 (단위: 억원)</div>
    <div class="grid">
      <div class="box">
        <div class="box-title">KOSPI</div>
        <div class="row"><span class="label">개인</span> <span class="{KOSPI_RET_COLOR}">{KOSPI_RET}</span></div>
        <div class="row"><span class="label">외국인</span> <span class="{KOSPI_FOR_COLOR}">{KOSPI_FOR}</span></div>
        <div class="row"><span class="label">기관</span> <span class="{KOSPI_INS_COLOR}">{KOSPI_INS}</span></div>
      </div>
      <div class="box">
        <div class="box-title">KOSDAQ</div>
        <div class="row"><span class="label">개인</span> <span class="{KOSDAQ_RET_COLOR}">{KOSDAQ_RET}</span></div>
        <div class="row"><span class="label">외국인</span> <span class="{KOSDAQ_FOR_COLOR}">{KOSDAQ_FOR}</span></div>
        <div class="row"><span class="label">기관</span> <span class="{KOSDAQ_INS_COLOR}">{KOSDAQ_INS}</span></div>
      </div>
    </div>
  </div>
</body>
</html>
