<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #16181a;
    color: #ffffff;
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    margin: 0;
    padding: 30px;
    width: 600px;
  }
  .card-container {
    background-color: #1e2124;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    border: 1px solid #2f3336;
  }
  .header-title {
    font-size: 18px;
    font-weight: bold;
    color: #4da6ff;
    margin-bottom: 20px;
    border-left: 4px solid #4da6ff;
    padding-left: 10px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .box {
    border-radius: 8px;
    padding: 10px 5px;
    width: calc(20% - 7px);
    box-sizing: border-box;
    text-align: center;
    color: #ffffff;
  }
  .box-title { font-size: 11px; margin-bottom: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .box-change { font-size: 13px; font-weight: bold; }
  /* Heatmap colors */
  .c-up-strong { background-color: #d92626; }
  .c-up { background-color: #ff4d4d; }
  .c-up-weak { background-color: #ff8080; color: #1a1a1a; }
  .c-flat { background-color: #404040; }
  .c-down-weak { background-color: #80b3ff; color: #1a1a1a; }
  .c-down { background-color: #4d94ff; }
  .c-down-strong { background-color: #1a66ff; }

  .issues-section {
    margin-top: 20px;
    background-color: #272a2e;
    border-radius: 12px;
    padding: 15px;
  }
  .issues-title {
    font-size: 14px;
    font-weight: bold;
    color: #ffd700;
    margin-bottom: 10px;
  }
  .issue-item {
    font-size: 13px;
    color: #cccccc;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .issue-stock {
    color: #ffffff;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="card-container">
    <div class="header-title">시가총액 상위 동향</div>
    <div class="grid">
      {LARGECAP_BOXES}
    </div>
    
    <div class="issues-section">
      <div class="issues-title">📌 오늘의 특징주 이슈</div>
      {SPECIAL_ISSUES}
    </div>
  </div>
</body>
</html>
