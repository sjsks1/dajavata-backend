name: Update Theme Data

on:
  schedule:
    # 1) 평일 장중 1시간 단위 집중 갱신 (월~금 KST 09:15 ~ 16:15, 매시 15분 총 8회)
    - cron: '15 0-7 * * 1-5'
    # 2) 평일 장 마감 후 저녁 정산 2회 (월~금 KST 18:15, 21:15)
    - cron: '15 9,12 * * 1-5'
    # 3) 주말 최소화 점검 1회 (토~일 KST 10:15)
    - cron: '15 1 * * 0,6'
  workflow_dispatch:       # 수동으로도 실행 가능하게

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: dajavata_backend
        run: pip install -r requirements.txt

      - name: Run update script
        working-directory: dajavata_backend
        run: python update_themes.py

      - name: Sync data to all directories
        run: |
          mkdir -p data dajavata/dist/data dajavata_backend/data
          cp dajavata_backend/data/*.json data/ || true
          cp dajavata_backend/data/*.json dajavata/dist/data/ || true

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json dajavata_backend/data/*.json dajavata/dist/data/*.json
          git diff --staged --quiet || git commit -m "Auto-update theme data [skip ci]"
          git push
